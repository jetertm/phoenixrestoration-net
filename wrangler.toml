# Pages project: phoenixrestoration-net
# Static files live at the repo root. Do not add a build command.
# Secrets are NOT in this file. See README "Quote form setup".
name = "phoenixrestoration-net"
compatibility_date = "2026-10-15"
pages_build_output_dir = "."

[vars]
LEAD_FROM_INBOX = "phoenix-leads@agentmail.to"
LEAD_TO = "info@phoenixrestoration.net"
# Production hostnames only. Do not add localhost or 127.0.0.1.
TURNSTILE_HOSTNAMES = "phoenixrestoration.net,www.phoenixrestoration.net,phoenixrestoration-net.pages.dev"
# Public sitekey already served by /api/turnstile-sitekey. Kept here so a
# deploy that applies this file does not drop the dashboard plain variable.
TURNSTILE_SITE_KEY = "0x4AAAAAAFX_kSSDb1epnI3G"

# AGENTMAIL_API_KEY is a Pages secret. Do not put it in this file.
